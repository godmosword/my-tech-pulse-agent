name: Scheduled pipeline run

# Runs python main.py on the runner, then commits dashboard/data + sqlite state
# + invest artifacts. Enable with repo variable PIPELINE_SCHEDULE_ENABLED=true.
# Manual workflow_dispatch always runs.

on:
  schedule:
    # 23:20 UTC = 07:20 Asia/Taipei
    - cron: '20 23 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-pipeline:
    name: Run pipeline + commit JSON
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: ${{ github.event_name == 'workflow_dispatch' || vars.PIPELINE_SCHEDULE_ENABLED == 'true' }}
    concurrency:
      group: pipeline-run
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Run pipeline
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-5.6-luna
          OPENAI_FLASH_MODEL: gpt-5.6-luna
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          NEWSAPI_KEY: ${{ secrets.NEWSAPI_KEY }}
          APIFY_API_KEY: ${{ secrets.APIFY_API_KEY }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          STATE_BACKEND: sqlite
          STATE_SQLITE_PATH: state/dedup.sqlite
          MEMORY_BACKEND: json
          MEMORY_ENABLED: "1"
          DIGEST_SNAPSHOT_ENABLED: "1"
          EARNINGS_REPORTS_ENABLED: "1"
          DASHBOARD_DATA_DIR: dashboard/data
          JSON_RETENTION_DAYS: "90"
          DIGEST_FORMAT: v1
        run: python main.py

      - name: Grade decisions (best-effort)
        continue-on-error: true
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
        run: python scripts/grade_decisions.py

      - name: Build invest brief
        env:
          DASHBOARD_DATA_DIR: dashboard/data
        run: python scripts/build_invest_brief.py

      - name: Commit artifacts if changed
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          mkdir -p state dashboard/data/earnings
          git add dashboard/data state/dedup.sqlite || true
          for f in track_record.json invest_brief.json; do
            if [ -f "backtest/results/$f" ]; then
              git add "backtest/results/$f"
            fi
          done
          if git diff --cached --quiet; then
            echo "No artifact changes to commit."
            exit 0
          fi
          git commit -m "chore(data): refresh pipeline JSON and invest artifacts"
          git push
