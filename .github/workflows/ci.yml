name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - 'backtest/results/**'
      - 'dashboard/data/**'
      - 'state/**'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: pytest (Python 3.11)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'

      - name: Ruff lint
        run: ruff check .

      - name: Pyright (core packages)
        run: pyright

      - name: Vulture dead code
        run: vulture . scripts/vulture_whitelist.py --exclude dashboard,node_modules,.venv,venv --min-confidence 80

      - name: Run tests with coverage
        run: >
          pytest -q
          --cov=agents --cov=sources --cov=scoring --cov=pipeline
          --cov=delivery --cov=llm --cov=backtest
          --cov-fail-under=62

  dashboard:
    name: dashboard (lint, typecheck, test)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: dashboard

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: dashboard/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

      - name: Production build
        run: npm run build
